name: CD - BlackoutClause Release

on:
  push:
    tags:
      - 'blackoutclause-v*'

env:
  DOTNET_VERSION: '8.0.x'
  GODOT_VERSION: '4.3.0'
  PROJECT_PATH: 'games/blackoutclause-fps'
  SOLUTION: 'BlackoutClause.sln'

jobs:
  build-server:
    name: Build & Publish Server
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Extract Version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/blackoutclause-v}" >> $GITHUB_OUTPUT
      - name: Restore
        run: |
          cd ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.SOLUTION }}
      - name: Build Server
        run: |
          cd ${{ env.PROJECT_PATH }}
          dotnet publish src/BlackoutClause.Server/BlackoutClause.Server.csproj -c Release -o ./artifacts/server --no-restore -p:Version=${{ steps.version.outputs.version }}
      - name: Build Docker Image
        run: |
          cd ${{ env.PROJECT_PATH }}
          docker build -t blackoutclause/server:${{ steps.version.outputs.version }} -f infrastructure/Dockerfile.server ..
      - name: Push to GHCR
        if: github.repository_owner == 'your-org'
        run: |
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag blackoutclause/server:${{ steps.version.outputs.version }} ghcr.io/${{ github.repository }}/server:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository }}/server:${{ steps.version.outputs.version }}
      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ steps.version.outputs.version }}
          path: ${{ env.PROJECT_PATH }}/artifacts/server/
          retention-days: 30

  build-client-windows:
    name: Build Client - Windows
    runs-on: windows-latest
    needs: build-server
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Godot
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build Client
        run: |
          dotnet publish src/BlackoutClause.Client/BlackoutClause.Client.csproj -c Release -r win-x64 --self-contained -o ../../artifacts/client/win-x64 -p:Version=${{ needs.build-server.outputs.version }}
      - name: Create NSIS Installer
        run: |
          # Requires NSIS installed
          makensis /DVERSION=${{ needs.build-server.outputs.version }} build/packaging/installer.nsi
      - name: Sign Binaries
        if: env.SIGN_WINDOWS_CERT != ''
        run: |
          # signtool sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 artifacts/client/win-x64/*.exe
          echo "Code signing skipped - configure SIGN_WINDOWS_CERT secret"
      - name: Upload Windows Client
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-${{ needs.build-server.outputs.version }}
          path: artifacts/client/win-x64/
          retention-days: 30

  build-client-macos:
    name: Build Client - macOS
    runs-on: macos-latest
    needs: build-server
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Godot
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build Client
        run: |
          dotnet publish src/BlackoutClause.Client/BlackoutClause.Client.csproj -c Release -r osx-arm64 --self-contained -o ../../artifacts/client/osx-arm64 -p:Version=${{ needs.build-server.outputs.version }}
      - name: Create DMG
        run: |
          # create-dmg --identity "Developer ID Application: Your Name" artifacts/client/osx-arm64/BlackoutClause.app
          echo "DMG creation skipped - configure signing"
      - name: Upload macOS Client
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ needs.build-server.outputs.version }}
          path: artifacts/client/osx-arm64/
          retention-days: 30

  build-client-linux:
    name: Build Client - Linux
    runs-on: ubuntu-latest
    needs: build-server
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Godot
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build Client
        run: |
          dotnet publish src/BlackoutClause.Client/BlackoutClause.Client.csproj -c Release -r linux-x64 --self-contained -o ../../artifacts/client/linux-x64 -p:Version=${{ needs.build-server.outputs.version }}
      - name: Create AppImage
        run: |
          # linuxdeploy --appdir artifacts/client/linux-x64 --output appimage
          echo "AppImage creation skipped"
      - name: Upload Linux Client
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-${{ needs.build-server.outputs.version }}
          path: artifacts/client/linux-x64/
          retention-days: 30

  build-client-android:
    name: Build Client - Android
    runs-on: ubuntu-latest
    needs: build-server
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
      - name: Install Godot
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Configure Godot Android Export
        run: |
          # Configure editor settings for Android
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << 'EOF'
          [resource]
          export/android/adb = "/usr/bin/adb"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/jarsigner = "/usr/lib/jvm/temurin-17-jdk/bin/jarsigner"
          export/android/keystore = ""
          export/android/keystore_password = ""
          export/android/keystore_user = ""
          export/android/key_password = ""
          export/android/sdk = "/opt/android/sdk"
          export/android/shapes = "arm64-v8a"
          export/android/minimum_sdk = 24
          export/android/target_sdk = 34
          EOF
      - name: Export Android
        run: |
          godot --headless --export-release "Android" ../../artifacts/client/android/BlackoutClause.apk
      - name: Upload Android Client
        uses: actions/upload-artifact@v4
        with:
          name: client-android-${{ needs.build-server.outputs.version }}
          path: artifacts/client/android/
          retention-days: 30

  build-client-ios:
    name: Build Client - iOS
    runs-on: macos-latest
    needs: build-server
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Godot
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Export iOS
        run: |
          # iOS export requires Xcode and provisioning profiles
          # This generates an Xcode project that must be built in Xcode
          godot --headless --export-release "iOS" ../../artifacts/client/ios/BlackoutClause.xcodeproj
        env:
          # These would be configured in GitHub secrets for actual signing
          GODOT_IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          GODOT_IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      - name: Upload iOS Client
        uses: actions/upload-artifact@v4
        with:
          name: client-ios-${{ needs.build-server.outputs.version }}
          path: artifacts/client/ios/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server, build-client-windows, build-client-macos, build-client-linux, build-client-android, build-client-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*-${{ needs.build-server.outputs.version }}
          merge-multiple: true
          path: ./release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: BlackoutClause ${{ github.ref_name }}
          body: |
            ## BlackoutClause ${{ github.ref_name }}
            
            ### Changes
            - See commit history for details
            
            ### Downloads
            - Windows: `BlackoutClause-Setup-${{ needs.build-server.outputs.version }}.exe`
            - macOS: `BlackoutClause-${{ needs.build-server.outputs.version }}.dmg`
            - Linux: `BlackoutClause-${{ needs.build-server.outputs.version }}.AppImage`
            - Android: `BlackoutClause-${{ needs.build-server.outputs.version }}.apk`
            - iOS: Xcode project (build with Xcode)
          files: |
            release-assets/**/*
          draft: false
          prerelease: false